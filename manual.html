<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0d1117">
<title>OBD Scanner User Manual</title>
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<style>
  :root { --bg:#0d1117; --card:#161b22; --text:#e6edf3; --muted:#8b949e; --line:#30363d; --blue:#58a6ff; --link:#58a6ff; }
  * { box-sizing:border-box; }
  html { scroll-behavior:smooth; }
  body { margin:0; font:16px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif; background:var(--bg); color:var(--text); }
  header.bar { position:sticky; top:0; z-index:5; display:flex; align-items:center; gap:12px; padding:12px 18px; background:#0d1117ee; border-bottom:1px solid var(--line); backdrop-filter:blur(8px); }
  header.bar a.back { color:var(--blue); text-decoration:none; font-weight:600; }
  header.bar h1 { font-size:16px; margin:0; font-weight:700; }
  header.bar .ver { color:var(--muted); font-weight:500; }
  article { max-width:820px; margin:0 auto; padding:24px 20px 80px; }
  article h1 { font-size:28px; line-height:1.2; margin:0 0 8px; }
  article h2 { font-size:22px; margin:36px 0 12px; padding-top:8px; border-top:1px solid var(--line); }
  article h2:first-of-type { border-top:0; }
  article h3 { font-size:17px; margin:22px 0 8px; }
  p, li { color:var(--text); }
  .muted, article h1 + p { color:var(--muted); }
  a { color:var(--link); }
  hr { border:0; border-top:1px solid var(--line); margin:24px 0; }
  code { font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace; font-size:0.9em; background:#21262d; padding:0.1em 0.35em; border-radius:4px; }
  pre { background:#161b22; border:1px solid var(--line); border-radius:8px; padding:12px 14px; overflow:auto; }
  pre code { background:none; padding:0; }
  table { border-collapse:collapse; width:100%; margin:12px 0 20px; font-size:14.5px; }
  th, td { border:1px solid var(--line); padding:7px 9px; text-align:left; vertical-align:top; }
  th { background:#21262d; }
  #toc { background:var(--card); border:1px solid var(--line); border-radius:10px; padding:14px 18px; margin:20px 0 28px; }
  #toc h2 { margin:0 0 8px; font-size:16px; border:0; padding:0; }
  #toc ol { margin:0; padding-left:22px; }
  #toc a { text-decoration:none; }
  #toc a:hover { text-decoration:underline; }
  .err { background:#3d1a1a; border:1px solid #f85149; color:#f85149; padding:12px 14px; border-radius:8px; }
  @media print {
    :root { --bg:#fff; --card:#f6f8fa; --text:#1f2328; --muted:#656d76; --line:#d0d7de; --blue:#0969da; --link:#0969da; }
    body { background:#fff; color:#1f2328; }
    header.bar { display:none; }
    a { color:inherit; text-decoration:none; }
    article { max-width:none; padding:0; }
    h2 { break-after:avoid; }
    table, pre { break-inside:avoid; }
    #toc { break-after:page; }
  }
</style>
</head>
<body>
<header class="bar">
  <a class="back" href="./">← App</a>
  <h1>OBD Scanner <span class="ver">User Manual</span></h1>
</header>
<article id="content"><p class="muted">Loading manual…</p></article>
<script>
(function () {
  function esc(s) {
    return String(s).replace(/[&<>]/g, function (c) { return ({'&':'&'+'amp;','<':'&'+'lt;','>':'&'+'gt;'})[c]; });
  }
  function inline(s) {
    s = esc(s);
    s = s.replace(/\[([^\]]+)\]\((https?:[^)]+)\)/g, '<a href="$2" rel="noopener">$1<\/a>');
    s = s.replace(/\[([^\]]+)\]\((#[^)]+)\)/g, '<a href="$2">$1<\/a>');
    s = s.replace(/\[([^\]]+)\]\(([^)]+)\)/g, '<a href="$2">$1<\/a>');
    s = s.replace(/\*\*([^*]+)\*\*/g, '<strong>$1<\/strong>');
    s = s.replace(/`([^`]+)`/g, '<code>$1<\/code>');
    return s;
  }
  function slug(s) {
    return s.toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-+|-+$/g, '');
  }
  function render(md) {
    var lines = md.replace(/\r\n/g, '\n').split('\n');
    var html = [];
    var i = 0;
    var inTable = false, inCode = false, inList = false, listTag = 'ul';
    function closeList() { if (inList) { html.push('</' + listTag + '>'); inList = false; } }
    function closeTable() { if (inTable) { html.push('</tbody></table>'); inTable = false; } }
    while (i < lines.length) {
      var line = lines[i];
      if (inCode) {
        if (line.indexOf('```') === 0) { html.push('</code></pre>'); inCode = false; }
        else html.push(esc(line) + '\n');
        i++; continue;
      }
      if (line.indexOf('```') === 0) {
        closeList(); closeTable();
        html.push('<pre><code>'); inCode = true; i++; continue;
      }
      if (line.indexOf('|') === 0 && line.trim().charAt(0) === '|') {
        closeList();
        if (/^\s*\|?\s*:?-{3,}/.test(line.replace(/\|/g, '|').split('|').slice(1, -1)[0] || '') || /^\s*\|?\s*[-: ]+\|/.test(line)) {
          i++; continue;
        }
        var cells = line.split('|');
        if (cells[0].trim() === '') cells.shift();
        if (cells.length && cells[cells.length - 1].trim() === '') cells.pop();
        cells = cells.map(function (c) { return c.trim(); });
        if (!inTable) {
          html.push('<table><thead><tr>' + cells.map(function (c) { return '<th>' + inline(c) + '</th>'; }).join('') + '</tr></thead><tbody>');
          inTable = true;
        } else {
          html.push('<tr>' + cells.map(function (c) { return '<td>' + inline(c) + '</td>'; }).join('') + '</tr>');
        }
        i++; continue;
      } else {
        closeTable();
      }
      if (/^\s*---+\s*$/.test(line)) { closeList(); html.push('<hr>'); i++; continue; }
      var hm = /^(#{1,3})\s+(.*)$/.exec(line);
      if (hm) {
        closeList();
        var level = hm[1].length;
        var text = hm[2].trim();
        var id = slug(text);
        html.push('<h' + level + ' id="' + id + '">' + inline(text) + '</h' + level + '>');
        i++; continue;
      }
      var lm = /^(\s*)([-*]|\d+\.)\s+(.*)$/.exec(line);
      if (lm) {
        var tag = /\d+\./.test(lm[2]) ? 'ol' : 'ul';
        if (!inList || listTag !== tag) { closeList(); listTag = tag; html.push('<' + tag + '>'); inList = true; }
        html.push('<li>' + inline(lm[3]) + '</li>');
        i++; continue;
      }
      closeList();
      if (!line.trim()) { i++; continue; }
      var para = [line];
      i++;
      while (i < lines.length && lines[i].trim() && !/^(#{1,3}\s+|```|\s*[-*]\s+|\s*\d+\.\s+|\s*\|)/.test(lines[i]) && !/^\s*---+\s*$/.test(lines[i])) {
        para.push(lines[i]); i++;
      }
      html.push('<p>' + inline(para.join(' ')) + '</p>');
    }
    closeList(); closeTable();
    if (inCode) html.push('</code></pre>');
    return html.join('\n');
  }
  fetch('MANUAL.md', { cache: 'no-cache' }).then(function (r) {
    if (!r.ok) throw new Error('HTTP ' + r.status);
    return r.text();
  }).then(function (md) {
    document.getElementById('content').innerHTML = render(md);
    if (location.hash) {
      var el = document.getElementById(location.hash.slice(1));
      if (el) el.scrollIntoView();
    }
  }).catch(function (e) {
    document.getElementById('content').innerHTML = '<p class="err">Could not load MANUAL.md (' + esc(e.message) + '). Open this page from the app site, or read the markdown on GitHub.</p>';
  });
})();
</script>
</body>
</html>
